<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>쉬는시간 오락실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="쉬는 시간 10분 안에 한 판씩 하기 좋은 브라우저 게임 모음">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: a classroom chalkboard. Date and duty line on the right like a real 칠판,
   games pinned as chalk-outlined cards, a wooden chalk ledge closing the page. */
:root {
  --board: #24342b;
  --board-deep: #1b2721;
  --board-line: #3a4c41;
  --chalk: #ecebe2;
  --chalk-dim: #a7b4a9;
  --chalk-yellow: #f2d87c;
  --chalk-pink: #f2a7a2;
  --chalk-blue: #9fcbe6;
  --wood: #7a5536;
  --wood-dark: #553a24;
  --font-chalk: "Gaegu", "Nanum Pen Script", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--board-deep); }
body {
  margin: 0;
  min-height: 100%;
  background:
    radial-gradient(120% 80% at 30% 0%, rgba(255,255,255,0.05), transparent 60%),
    radial-gradient(90% 60% at 80% 100%, rgba(0,0,0,0.25), transparent 70%),
    var(--board);
  color: var(--chalk);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding-block: 28px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- header ---------- */
.board-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px 24px;
  align-items: end;
  padding-bottom: 18px;
  border-bottom: 2px dashed var(--board-line);
}
.board-head h1 {
  margin: 0;
  font-family: var(--font-chalk);
  font-weight: 700;
  font-size: clamp(2.6rem, 8vw, 4.4rem);
  line-height: 1;
  letter-spacing: -0.01em;
  text-wrap: balance;
  text-shadow: 0 0 1px rgba(236,235,226,0.6), 0 0 14px rgba(236,235,226,0.08);
}
.board-head h1 em {
  font-style: normal;
  color: var(--chalk-yellow);
}
.board-head .hook {
  margin: 10px 0 0;
  color: var(--chalk-dim);
  max-width: 34em;
}
.duty {
  font-family: var(--font-chalk);
  font-size: 1.25rem;
  line-height: 1.35;
  text-align: right;
  color: var(--chalk);
  white-space: nowrap;
}
.duty span { display: block; }
.duty .who { color: var(--chalk-dim); font-size: 1.05rem; }

/* ---------- game list ---------- */
.games {
  list-style: none;
  margin: 28px 0 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 22px;
}
.game { min-width: 0; }
.game a {
  display: grid;
  grid-template-rows: auto auto;
  align-content: start;
  gap: 12px;
  height: 100%;
  color: inherit;
  text-decoration: none;
  border-radius: 14px;
  padding: 10px 10px 14px;
  border: 2px solid transparent;
  transition: border-color .15s ease, background-color .15s ease, transform .15s ease;
}
.game a:hover { border-color: var(--board-line); background-color: rgba(255,255,255,0.025); }
.game a:active { transform: translateY(1px); }
.game a:focus-visible { outline: 3px solid var(--chalk-yellow); outline-offset: 3px; }

.shot {
  position: relative;
  aspect-ratio: 390 / 600;
  max-width: 100%;
  border-radius: 10px;
  overflow: hidden;
  background: var(--card-bg, var(--board-deep));
  box-shadow: 0 0 0 2px rgba(236,235,226,0.85), 0 10px 24px rgba(0,0,0,0.35);
  transform: rotate(var(--tilt, 0deg));
  transition: transform .2s ease;
}
.game a:hover .shot { transform: rotate(0deg) scale(1.02); }
.shot img {
  position: relative;
  z-index: 1;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
}
.shot .fallback {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-family: var(--font-chalk);
  font-size: 2rem;
  font-weight: 700;
  color: var(--card-accent, var(--chalk));
  text-align: center;
  padding: 12px;
}
.info { display: grid; gap: 4px; min-width: 0; }
.info h2 {
  margin: 0;
  font-family: var(--font-chalk);
  font-weight: 700;
  font-size: 1.75rem;
  line-height: 1.15;
  color: var(--card-accent, var(--chalk));
  text-wrap: balance;
}
.info p { margin: 0; }
.tagline { color: var(--chalk); }
.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  margin-top: 4px;
  font-size: 0.85rem;
  color: var(--chalk-dim);
}
.meta .time { color: var(--chalk-yellow); letter-spacing: 0.02em; }
.best {
  font-size: 0.85rem;
  color: var(--chalk-pink);
  font-variant-numeric: tabular-nums;
}

/* ---------- ledge ---------- */
.ledge {
  margin-top: 40px;
  height: 22px;
  background: linear-gradient(var(--wood), var(--wood-dark));
  box-shadow: 0 -2px 0 rgba(0,0,0,0.25) inset, 0 -6px 14px rgba(0,0,0,0.25);
  position: relative;
}
.ledge::before, .ledge::after {
  content: "";
  position: absolute;
  top: -7px;
  height: 9px;
  border-radius: 3px;
}
.ledge::before { left: 18%; width: 46px; background: var(--chalk); transform: rotate(-3deg); }
.ledge::after { left: 22%; width: 30px; background: var(--chalk-yellow); transform: rotate(4deg); }
.foot {
  background: var(--wood-dark);
  color: #d9c3a9;
  font-size: 0.85rem;
  padding-block: 12px calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  text-align: center;
}

/* ---------- narrow screens: one game per row, thumbnail on the left ---------- */
@media (max-width: 860px) {
  .board-head { grid-template-columns: minmax(0, 1fr); }
  .duty { text-align: left; white-space: normal; display: flex; flex-wrap: wrap; gap: 0 14px; }
  .duty span { display: inline; }
  .games { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .game a {
    grid-template-columns: 104px minmax(0, 1fr);
    grid-template-rows: auto;
    align-items: center;
    gap: 16px;
    padding: 10px 8px;
    border-color: transparent;
    border-bottom: 2px dashed var(--board-line);
    border-radius: 0;
  }
  .game:last-child a { border-bottom-color: transparent; }
  .shot { aspect-ratio: 390 / 560; }
  .shot .fallback { font-size: 1.2rem; }
  .info h2 { font-size: 1.6rem; }
}
@media (prefers-reduced-motion: reduce) {
  .shot, .game a { transition: none; }
  .shot { transform: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="board-head">
    <div>
      <h1>쉬는시간 <em>오락실</em></h1>
      <p class="hook">종 치기 전까지 딱 한 판. 폰으로도, 컴퓨터로도 바로 할 수 있어요.</p>
    </div>
    <p class="duty" aria-label="오늘 날짜">
      <span id="today">오늘</span>
      <span class="who">주번: 게임 35개</span>
    </p>
  </header>

  <ul class="games" id="games"></ul>
</div>
<div class="ledge" aria-hidden="true"></div>
<footer class="foot">최고 기록은 이 기기에만 저장돼요.</footer>

function readBest(slug) {
  // Every game with a single score saves it as a plain number under "arcade.<slug>.best".
  try {
    var v = localStorage.getItem('arcade.' + slug + '.best');
    if (v && /^\d+(\.\d+)?$/.test(v) && Number(v) > 0) return Number(v);
  } catch (e) { /* storage unavailable */ }
  return null;
}

function render() {
  var list = document.getElementById('games');
  var html = '';
  GAMES.forEach(function (g) {
    var best = g.fmt ? readBest(g.slug) : null;
    html +=
      '<li class="game" style="--card-accent:' + g.accent + ';--card-bg:' + g.bg + ';--tilt:' + g.tilt + 'deg">' +
        '<a href="games/' + g.slug + '/index.html">' +
          '<div class="shot">' +
            '<div class="fallback" aria-hidden="true">' + g.title + '</div>' +
            '<img src="assets/thumbs/' + g.slug + '.jpg" alt="' + g.title + ' 게임 화면" loading="lazy" onerror="this.remove()">' +
          '</div>' +
          '<div class="info">' +
            '<h2>' + g.title + '</h2>' +
            '<p class="tagline">' + g.tagline + '</p>' +
            '<p class="meta"><span class="time">' + g.time + '</span><span>' + g.controls + '</span></p>' +
            (best !== null ? '<p class="best">내 최고 기록 ' + g.fmt(best) + '</p>' : '') +
          '</div>' +
        '</a>' +
      '</li>';
  });
  list.innerHTML = html;
}

})();
render();

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>놓아놓아</title>
<meta name="description" content="줄을 쏘고, 놓고, 날아가는 원버튼 스윙 게임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap">
<style>
:root {
  --ink: #1a1424;
  --sky-top: #1c2a4d;
  --sky-mid: #6a4a7c;
  --sky-low: #f08a5d;
  --sky-horizon: #ffd08a;
  --sun: #ffe6a8;
  --far: #5a4a72;
  --mid: #33284a;
  --rock: #3b2a3f;
  --rock-dark: #21172a;
  --rock-light: #5c4459;
  --moss: #5ed1a0;
  --moss-light: #c3f7d2;
  --crack: #8a5f4c;
  --crack-line: #ffb067;
  --water-top: #2fb6b0;
  --water-deep: #0b3550;
  --foam: #eafff8;
  --accent: #ff8a3d;
  --accent-2: #ffd166;
  --text: #fff5e6;
  --text-dim: #d9c7d6;
  --panel: rgba(28, 20, 38, 0.86);
  --hero: #e2622f;
  --hero-dark: #4a2219;
  --hero-light: #fff1e0;
  --scarf: #3fd1b5;
  --rope: #ecd6a4;
  --font-ui: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", sans-serif;
  --font-title: "Black Han Sans", "Jua", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", sans-serif;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--ink); color: var(--text);
  font-family: var(--font-ui);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  overscroll-behavior: none;
}
#app {
  position: fixed; inset: 0; touch-action: none; overflow: hidden;
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 42%, var(--sky-low) 72%, var(--sky-horizon) 90%);
}
#vignette {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 85% 75% at 50% 45%, rgba(26, 20, 36, 0) 55%, rgba(26, 20, 36, 0.45) 100%);
}
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

button { font-family: var(--font-ui); cursor: pointer; border: 0; }
.icon-btn {
  position: absolute; width: 48px; height: 48px; border-radius: 16px;
  background: rgba(26, 20, 36, 0.55); color: var(--text);
  display: grid; place-items: center; pointer-events: auto;
  box-shadow: inset 0 0 0 2px rgba(255, 245, 230, 0.16);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.icon-btn:active { transform: scale(0.94); }
.icon-btn svg { width: 24px; height: 24px; }
#btnMute { top: calc(10px + var(--sat)); right: calc(12px + var(--sar)); z-index: 30; }
#btnMute .off { display: none; }
#btnMute.muted .on { display: none; }
#btnMute.muted .off { display: block; }

#hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
#hud[hidden] { display: none; }
#btnPause { top: calc(10px + var(--sat)); left: calc(12px + var(--sal)); }
.dist {
  position: absolute; top: calc(6px + var(--sat)); left: 50%; transform: translateX(-50%);
  text-align: center; line-height: 1; white-space: nowrap;
}
.dist b {
  font-family: var(--font-title); font-weight: 400; font-size: 46px; color: var(--text);
  text-shadow: 0 3px 0 var(--ink), 0 0 18px rgba(255, 138, 61, 0.35);
  letter-spacing: 1px;
}
.dist b small { font-size: 24px; margin-left: 2px; color: var(--accent-2); }
.dist .best { display: block; margin-top: 4px; font-size: 15px; color: var(--text-dim); text-shadow: 0 2px 0 var(--ink); }
.dist.pop b { animation: pop 0.35s ease-out; }
@keyframes pop { 0% { transform: scale(1.25); color: var(--accent-2); } 100% { transform: scale(1); } }

#ropeInd {
  position: absolute; left: 50%; bottom: calc(18px + var(--sab)); transform: translateX(-50%);
  display: flex; align-items: center; gap: 8px; padding: 8px 16px 8px 10px;
  border-radius: 999px; background: rgba(26, 20, 36, 0.62);
  box-shadow: inset 0 0 0 2px rgba(255, 245, 230, 0.14);
  font-size: 17px; color: var(--text-dim); white-space: nowrap;
  transition: background 0.15s, color 0.15s, box-shadow 0.15s;
}
#ropeInd .dot {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(255, 245, 230, 0.12); transition: background 0.15s;
}
#ropeInd .dot svg { width: 18px; height: 18px; }
#ropeInd.ready { color: var(--ink); background: var(--accent-2); box-shadow: 0 0 0 3px rgba(255, 209, 102, 0.35), 0 4px 0 rgba(26, 20, 36, 0.6); }
#ropeInd.ready .dot { background: var(--ink); color: var(--accent-2); }
#ropeInd.hold { color: var(--ink); background: var(--moss); }
#ropeInd.hold .dot { background: var(--ink); color: var(--moss); }
#ropeInd.jump { color: var(--ink); background: var(--accent); }
#ropeInd.jump .dot { background: var(--ink); color: var(--accent); }
#ropeInd.fly .dot { color: var(--text-dim); }

#banner {
  position: absolute; left: 50%; top: calc(120px + var(--sat)); transform: translate(-50%, -10px);
  padding: 10px 20px; border-radius: 14px; background: rgba(11, 53, 80, 0.88);
  color: var(--foam); font-size: 20px; white-space: nowrap; opacity: 0;
  box-shadow: inset 0 0 0 2px rgba(234, 255, 248, 0.3);
  transition: opacity 0.25s, transform 0.25s;
}
#banner.show { opacity: 1; transform: translate(-50%, 0); }

.overlay {
  position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
  padding: calc(20px + var(--sat)) calc(18px + var(--sar)) calc(20px + var(--sab)) calc(18px + var(--sal));
  background: radial-gradient(120% 90% at 50% 40%, rgba(26, 20, 36, 0.2), rgba(26, 20, 36, 0.72));
  overflow-y: auto;
}
.overlay[hidden] { display: none; }
.card {
  width: min(420px, 100%); text-align: center; padding: 26px 22px 22px;
  border-radius: 26px; background: var(--panel);
  box-shadow: inset 0 0 0 2px rgba(255, 245, 230, 0.12), 0 18px 50px rgba(0, 0, 0, 0.45);
}
.logo {
  font-family: var(--font-title); font-weight: 400; font-size: 64px; line-height: 1; margin: 4px 0 10px;
  color: var(--accent-2); letter-spacing: 2px;
  text-shadow: 0 4px 0 #b44a20, 0 8px 0 var(--ink), 0 0 30px rgba(255, 138, 61, 0.45);
}
.logo span { color: var(--accent); }
.hook { font-size: 19px; color: var(--text); margin: 0 0 16px; }
.howto { display: grid; gap: 8px; margin: 0 0 18px; text-align: left; }
.howto div {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 14px;
  background: rgba(255, 245, 230, 0.06); font-size: 16px; color: var(--text-dim); line-height: 1.35;
}
.howto em { font-style: normal; color: var(--accent-2); }
.tag {
  flex: none; min-width: 52px; text-align: center; padding: 4px 8px; border-radius: 9px;
  background: var(--ink); color: var(--moss); font-size: 14px; box-shadow: inset 0 -2px 0 rgba(94, 209, 160, 0.4);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; min-height: 56px; min-width: 200px;
  padding: 0 28px; border-radius: 18px; font-size: 24px; color: var(--ink);
  background: var(--accent); box-shadow: 0 5px 0 #a8461b, 0 10px 20px rgba(0, 0, 0, 0.3);
}
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #a8461b; }
.btn.sub { background: rgba(255, 245, 230, 0.12); color: var(--text); box-shadow: inset 0 0 0 2px rgba(255, 245, 230, 0.18); min-width: 160px; font-size: 19px; min-height: 48px; }
.btns { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.bestline { margin-top: 14px; color: var(--text-dim); font-size: 16px; }
.bestline b { color: var(--accent-2); font-weight: 400; }
.back {
  position: absolute; top: calc(12px + var(--sat)); left: calc(12px + var(--sal)); z-index: 25;
  min-height: 44px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 14px;
  color: var(--text); text-decoration: none; font-size: 16px; background: rgba(26, 20, 36, 0.6);
  box-shadow: inset 0 0 0 2px rgba(255, 245, 230, 0.14);
}
.res-title { font-family: var(--font-title); font-weight: 400; font-size: 44px; margin: 0 0 6px; color: var(--foam); text-shadow: 0 4px 0 var(--water-deep); }
.res-sub { color: var(--text-dim); font-size: 16px; margin: 0 0 14px; }
.res-num { font-family: var(--font-title); font-size: 72px; line-height: 1; color: var(--text); margin: 6px 0 4px; }
.res-num small { font-size: 32px; color: var(--accent-2); margin-left: 4px; }
.newrec {
  display: inline-block; margin: 6px 0 2px; padding: 6px 14px; border-radius: 999px;
  background: var(--accent-2); color: var(--ink); font-size: 18px;
  animation: glow 1.2s ease-in-out infinite alternate;
}
.newrec[hidden] { display: none; }
@keyframes glow { from { transform: scale(1); } to { transform: scale(1.08); } }
.res-best { margin: 10px 0 20px; font-size: 18px; color: var(--text-dim); }
.res-best b { color: var(--accent-2); font-weight: 400; }
.pause-title { font-family: var(--font-title); font-size: 40px; margin: 0 0 18px; color: var(--text); }
.hint { margin-top: 12px; font-size: 14px; color: var(--text-dim); }
@media (orientation: portrait) and (min-height: 700px) {
  #title { align-items: flex-end; }
}
@media (max-height: 640px) {
  .logo { font-size: 50px; }
  .howto div { padding: 6px 10px; font-size: 15px; }
  .card { padding: 18px 18px 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .newrec, .dist.pop b { animation: none; }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="놓아놓아 게임 화면"></canvas>
  <div id="vignette"></div>

  <div id="hud" hidden>
    <button id="btnPause" class="icon-btn" aria-label="일시정지">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
    </button>
    <div class="dist" id="distBox"><b><span id="distV">0</span><small>m</small></b><span class="best">최고 <span id="bestV">0</span>m</span></div>
    <div id="ropeInd" class="jump">
      <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 3v9"/><path d="M12 12c-4 0-6 2.5-6 5.5"/><path d="M12 12c4 0 6 2.5 6 5.5"/><path d="M12 12v8"/></svg></span>
      <span id="ropeTxt">탭해서 점프!</span>
    </div>
    <div id="banner">큰 파도가 와요!</div>
  </div>

  <button id="btnMute" class="icon-btn" aria-label="소리 켜기/끄기">
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6"/><path d="M22 9l-5 6"/></svg>
  </button>

  <section id="title" class="overlay">
    <a href="../../index.html" class="back">← 게임 목록</a>
    <div class="card">
      <div class="logo">놓아<span>놓아</span></div>
      <p class="hook">줄을 쏘고, 놓고, 훨훨 날아가요!</p>
      <div class="howto">
        <div><span class="tag">터치</span><span>화면을 탭하면 <em>줄을 쏘고</em>, 다시 탭하면 <em>줄을 놓아요</em>.</span></div>
        <div><span class="tag">키보드</span><span><em>스페이스바</em>로 똑같이 해요. 일시정지는 Esc나 P예요.</span></div>
        <div><span class="tag">요령</span><span>앞으로 올라갈 때 놓으면 멀리 날아요. 구멍엔 줄이 안 걸리고, 파도에 닿으면 끝이에요.</span></div>
      </div>
      <div class="btns"><button class="btn" id="btnStart">시작하기</button></div>
      <div class="bestline">최고 기록 <b id="titleBest">0</b>m</div>
    </div>
  </section>

  <section id="pause" class="overlay" hidden>
    <div class="card">
      <div class="pause-title">잠깐 쉬어요</div>
      <div class="btns">
        <button class="btn" id="btnResume">계속하기</button>
        <button class="btn sub" id="btnHome">처음 화면으로</button>
      </div>
      <div class="hint">스페이스바나 Esc로도 계속할 수 있어요.</div>
    </div>
  </section>

  <section id="result" class="overlay" hidden>
    <a href="../../index.html" class="back">← 게임 목록</a>
    <div class="card">
      <div class="res-title">풍덩!</div>
      <p class="res-sub" id="resSub">파도에 휩쓸렸어요.</p>
      <div class="res-num"><span id="resDist">0</span><small>m</small></div>
      <div class="newrec" id="resNew" hidden>새 기록이에요!</div>
      <div class="res-best">최고 기록 <b id="resBest">0</b>m</div>
      <div class="btns"><button class="btn" id="btnRetry">다시 하기</button></div>
    </div>
  </section>
</div>

<script>
'use strict';
(() => {
// ================= CONFIG =================
const CFG = {
  G: 2100,               // gravity (units/s^2)
  R: 22,                 // hero radius
  ROPE_ANGLE: 58 * Math.PI / 180,
  ROPE_SPEED: 2500,
  ROPE_RETRACT: 3200,
  ROPE_MAX: 620,         // long enough to reach the ceiling from deep in the taller cave
  ROPE_MIN: 50,
  PUMP: 210,             // tangential push while swinging forward
  VMAX: 1700,
  STEP: 1 / 120,
  COL: 20,               // ceiling column width
  UNIT: 50,              // units per metre
  VIEW_H: 960,
  VIEW_W_MIN: 540,
  PILLAR_X: 0,
  PILLAR_TOP: 330,
  WATER_START: 830,
  SAFE_START: 760,       // ceiling is solid until here
};
const TAU = Math.PI * 2;
const RING = 4096;
const KEY_BEST = 'arcade.swing.best';
const KEY_MUTE = 'arcade.swing.muted';

const cssv = getComputedStyle(document.documentElement);
const C = {};
['ink','sky-top','sky-mid','sky-low','sky-horizon','sun','far','mid','rock','rock-dark','rock-light','moss','moss-light',
 'crack','crack-line','water-top','water-deep','foam','accent','accent-2','text','hero','hero-dark','hero-light','scarf','rope']
  .forEach((k) => { C[k.replace(/-([a-z0-9])/g, (_, c) => c.toUpperCase())] = cssv.getPropertyValue('--' + k).trim(); });

const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();

// ================= STORAGE =================
function load(key, def) { try { const v = localStorage.getItem(key); return v === null ? def : v; } catch (e) { return def; } }
function save(key, val) { try { localStorage.setItem(key, String(val)); } catch (e) { /* ignore */ } }

// ================= DOM =================
const $ = (id) => document.getElementById(id);
const app = $('app'), cv = $('cv'), ctx = cv.getContext('2d');
const ui = {
  hud: $('hud'), title: $('title'), pause: $('pause'), result: $('result'),
  distV: $('distV'), bestV: $('bestV'), distBox: $('distBox'), ropeInd: $('ropeInd'), ropeTxt: $('ropeTxt'),
  banner: $('banner'), titleBest: $('titleBest'), resDist: $('resDist'), resBest: $('resBest'), resNew: $('resNew'), resSub: $('resSub'),
  btnMute: $('btnMute'),
};

// ================= UTIL =================
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
function hash(i) { let x = (i | 0) * 374761393 + 668265263; x = (x ^ (x >>> 13)) * 1274126177; x = x ^ (x >>> 16); return (x >>> 0) / 4294967296; }
function smooth01(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }

// ================= STATE =================
const hero = { x: 0, y: 0, vx: 0, vy: 0, rot: 0, onPillar: true, dead: false, sink: 0, blink: 0 };
const rope = {
  state: 'ready', // ready | flying | attached | retract
  tipX: 0, tipY: 0, dirX: 0, dirY: 0, ax: 0, ay: 0, len: 0, phi: 0, omega: 0,
  wob: 0, wobV: 0, crumble: 0, col: 0, buffered: 0, lastTipY: 0, ox: 0, oy: 0,
};
const water = { y: CFG.WATER_START, target: CFG.WATER_START, stall: 0, surge: 0, nextSurge: 12, surgeT: -1, surgeA: 0, warned: false };
const cam = { x: 0, y: 0, shake: 0, sx: 0, sy: 0 };
const S = {
  mode: 'title', // title | play | paused | dying | over
  t: 0, playT: 0, timeScale: 1, acc: 0,
  maxX: 0, dist: 0, best: 0, ghost: 0, lastProgT: 0, newRecord: false, passedBest: false,
  nextMilestone: 100, lastSkim: -10, combo: 0, dieT: 0,
  shownDist: -1, shownRope: '', resultAt: 0, splashed: false,
  stats: { shots: 0, attaches: 0, misses: 0, releases: 0, perfect: 0, crumbles: 0, bumps: 0 },
};
S.best = Math.max(0, parseInt(load(KEY_BEST, '0'), 10) || 0);

let W = 0, H = 0, DPR = 1, SCALE = 1, VW = 0, VH = 0;

// ================= CEILING =================
const cSurf = new Float32Array(RING);
const cType = new Uint8Array(RING); // 0 hole, 1 rock, 2 cracked, 3 broken
const gen = { i: 0, left: 0, type: 1 };
const ri = (i) => ((i % RING) + RING) % RING;
function surfNoise(i) {
  return 26 + 13 * Math.sin(i * 0.19 + 1.3) + 9 * Math.sin(i * 0.053 + 0.4) + (hash(i) - 0.5) * 8;
}
function resetCeiling() {
  gen.i = Math.floor(-1400 / CFG.COL); gen.left = 0; gen.type = 1;
}
function newRun() {
  const x = gen.i * CFG.COL;
  const m = Math.max(0, (x - CFG.PILLAR_X) / CFG.UNIT);
  const d = clamp(m / 800, 0, 1);
  if (x < CFG.SAFE_START) {
    gen.type = 1; gen.left = Math.ceil((CFG.SAFE_START - x) / CFG.COL); return;
  }
  if (gen.type !== 0) {
    const w = lerp(60, 205, d) * rand(0.75, 1.2) + Math.min(70, Math.max(0, m - 800) * 0.06);
    gen.type = 0; gen.left = Math.max(3, Math.round(w / CFG.COL));
  } else {
    const w = lerp(560, 190, d) * rand(0.8, 1.3);
    const crackChance = m > 180 ? 0.08 + 0.3 * d : 0;
    gen.type = Math.random() < crackChance ? 2 : 1;
    gen.left = Math.max(gen.type === 2 ? 6 : 8, Math.round(w / CFG.COL));
  }
}
function genOne() {
  if (gen.left <= 0) newRun();
  const k = ri(gen.i);
  cType[k] = gen.type;
  cSurf[k] = surfNoise(gen.i);
  gen.left--; gen.i++;
}
function ensureGen(i) { while (gen.i <= i) genOne(); }
function colType(i) { ensureGen(i); return cType[ri(i)]; }
function colSurf(i) { ensureGen(i); return cSurf[ri(i)]; }
const isSolid = (t) => t === 1 || t === 2;
function nearHole(i, n) {
  for (let k = 1; k <= n; k++) { if (!isSolid(colType(i - k)) || !isSolid(colType(i + k))) return true; }
  return false;
}

// ================= WATER =================
function waveAmp() { return 7 + 7 * clamp(S.dist / 800, 0, 1); }
function waterAt(x) {
  return water.y + Math.sin(x * 0.011 + S.t * 1.7) * waveAmp() + Math.sin(x * 0.027 - S.t * 2.6) * 4;
}
function updateWater(dt) {
  const m = S.dist;
  let base = CFG.WATER_START - 160 * smooth01(m / 900) - Math.min(60, Math.max(0, m - 900) * 0.035);
  if (S.mode === 'play') {
    const idle = S.playT - S.lastProgT;
    // stalling (hanging around, or sitting on the start rock) makes the tide chase you all the way up
    if (idle > 2.2) water.stall = Math.min(900, water.stall + ((hero.onPillar ? 22 : 40) + 30 * (idle - 2.2)) * dt);
    else water.stall = Math.max(0, water.stall - 55 * dt);
    // surges
    if (m > 120 || water.surgeT >= 0) {
      if (water.surgeT < 0) {
        water.nextSurge -= dt;

const AU = { ctx: null, master: null, muted: load(KEY_MUTE, '0') === '1', noise: null, windGain: null, windFilter: null };
function ensureAudio() {
  try {
    if (!AU.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ac = new AC();
      AU.ctx = ac;
      AU.master = ac.createGain();
      AU.master.gain.value = AU.muted ? 0 : 0.55;
      AU.master.connect(ac.destination);
      const len = ac.sampleRate | 0;
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      AU.noise = buf;

      const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 500; f.Q.value = 0.8;
      const g = ac.createGain(); g.gain.value = 0;

    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

}

    const f = ac.createBiquadFilter(); f.type = ftype; f.Q.value = q || 1;

// ================= ACTIONS =================
function action() {
  if (S.mode !== 'play') return;
  if (hero.onPillar) { jump(); return; }
  if (rope.state === 'attached') { releaseRope(); return; }
  if (rope.state === 'ready') { shootRope(); return; }
  if (rope.state === 'retract') rope.buffered = 0.16;
}
function jump() {
  hero.onPillar = false; hero.vx = 620; hero.vy = -760;
  burst(0, hero.x - 6, hero.y + CFG.R, 10, 160, 0.5, 4, 300, -1, -0.2, 1.4);

}
function shootRope() {
  if (rope.state !== 'ready' || hero.onPillar) return false;
  rope.state = 'flying';
  rope.dirX = Math.cos(CFG.ROPE_ANGLE); rope.dirY = -Math.sin(CFG.ROPE_ANGLE);
  rope.tipX = hero.x; rope.tipY = hero.y - CFG.R * 0.6; rope.lastTipY = rope.tipY;
  rope.ox = rope.tipX; rope.oy = rope.tipY;

}
function releaseRope() {
  if (rope.state !== 'attached') return false;
  // release quality: best when swinging forward and up a bit past the bottom
  let q = 0;
  if (rope.omega > 0 && rope.omega * rope.len > 300) {
    const a = rope.phi;
    if (a > 0.5 && a < 0.68) q = 2; else if (a > 0.32 && a < 0.9) q = 1;
  }
  const v = rope.omega * rope.len;
  hero.vx = v * Math.cos(rope.phi); hero.vy = -v * Math.sin(rope.phi);

    S.combo = q === 2 ? S.combo + 1 : 0; if (q === 2) S.stats.perfect++;
    popup(q === 2 ? (S.combo > 1 ? '완벽해요! x' + Math.min(S.combo, 99) : '완벽해요!') : '좋아요!', hero.x, hero.y + 64, q === 2 ? C.accent2 : C.mossLight, q === 2 ? 28 : 24);

function attachRope(ci) {
  const r = rope;

  const dx = hero.x - r.ax, dy = hero.y - r.ay;
  let L = Math.hypot(dx, dy);
  L = Math.max(CFG.ROPE_MIN, L);
  r.len = L;
  r.phi = Math.atan2(dx, dy);
  const cp = Math.cos(r.phi), sp = Math.sin(r.phi);

  const vr = hero.vx * sp + hero.vy * cp;           // radial (outward +)
  r.omega = vt / L;
  r.col = ci; S.stats.attaches++;
  r.crumble = colType(ci) === 2 ? 0.85 : 0;
  r.wob = clamp(Math.abs(vr) * 0.05, 4, 26) * (Math.random() < 0.5 ? -1 : 1); r.wobV = 0;

// ================= UPDATE =================
function step(h) {
  const r = rope, R = CFG.R;
  if (r.buffered > 0) { r.buffered -= h; if (r.state === 'ready' && !hero.onPillar) shootRope(); }

  // rope tip motion
  if (r.state === 'flying') {
    r.lastTipY = r.tipY;
    r.tipX += r.dirX * CFG.ROPE_SPEED * h; r.tipY += r.dirY * CFG.ROPE_SPEED * h;
    const ci = Math.floor(r.tipX / CFG.COL);
    const t = colType(ci), sf = colSurf(ci);
    if (isSolid(t) && r.tipY <= sf) {
      if (r.lastTipY >= sf - 1) { r.tipY = sf; attachRope(ci); } // came from below: grab the surface
      else if (r.tipY >= sf - 16) attachRope(ci);                // clipped the lip of a hole
      else {
        // hit the inner wall of a hole: hooks cannot hold there
        r.state = 'retract';
        burst(3, r.tipX, r.tipY, 6, 200, 0.3, 2.5, 0, -1, 0.3, 1.5);
        popup('헛손질!', r.tipX, Math.max(r.tipY, 40) + 40, C.text, 22);
        sfx.miss(); S.combo = 0; S.stats.misses++;
      }
    } else if (Math.hypot(r.tipX - r.ox, r.tipY - r.oy) > CFG.ROPE_MAX) {
      r.state = 'retract';
      popup('헛손질!', r.tipX, Math.max(r.tipY, 40) + 30, C.text, 22);
      sfx.miss(); S.combo = 0; S.stats.misses++;
    }
  } else if (r.state === 'retract') {
    const dx = hero.x - r.tipX, dy = hero.y - r.tipY, d = Math.hypot(dx, dy);
    const s = CFG.ROPE_RETRACT * h;
    if (d <= s + 4) { r.state = 'ready'; } else { r.tipX += dx / d * s; r.tipY += dy / d * s; }
  }

  if (r.state === 'attached') {
    // crumbling ceiling
    if (r.crumble > 0) {
      r.crumble -= h;
      if (r.crumble <= 0) { crumbleAt(r.col); }
    }
  }

  if (r.state === 'attached') {
    const L = r.len;
    let alpha = -(CFG.G / L) * Math.sin(r.phi);
    if (r.omega > 0) alpha += CFG.PUMP / L;
    r.omega += alpha * h;
    r.omega *= 1 - 0.03 * h;
    const vmax = CFG.VMAX / L;
    r.omega = clamp(r.omega, -vmax, vmax);
    const prevPhi = r.phi;
    r.phi += r.omega * h;
    let nx = r.ax + L * Math.sin(r.phi), ny = r.ay + L * Math.cos(r.phi);
    // ceiling bump while swinging high: bounce back only when moving upward into rock
    const ci = Math.floor(nx / CFG.COL);
    if (ny < r.ay + R && isSolid(colType(ci)) && ny - R * 0.8 < colSurf(ci) && r.omega * Math.sin(prevPhi) > 0) {

      nx = r.ax + L * Math.sin(r.phi); ny = r.ay + L * Math.cos(r.phi);

    }

    hero.vy += CFG.G * h;
    hero.vx -= hero.vx * 0.04 * h;
    const sp = Math.hypot(hero.vx, hero.vy);
    if (sp > CFG.VMAX) { hero.vx *= CFG.VMAX / sp; hero.vy *= CFG.VMAX / sp; }
    const py = hero.y;
    hero.x += hero.vx * h; hero.y += hero.vy * h;
    // ceiling collision
    const ci = Math.floor(hero.x / CFG.COL);
    if (isSolid(colType(ci)) && hero.y - R * 0.8 < colSurf(ci)) {
      if (py - R * 0.8 >= colSurf(ci) - 2) { hero.y = colSurf(ci) + R * 0.8; if (hero.vy < 0) { hero.vy = -hero.vy * 0.25; bumpFx(hero.x, hero.y - R); } }
      else { hero.x -= hero.vx * h; hero.vx = -hero.vx * 0.3; }
    }
    // landing back on the start pillar
    if (Math.abs(hero.x - CFG.PILLAR_X) < 46 && hero.vy > 0 && py + R <= CFG.PILLAR_TOP + 2 && hero.y + R >= CFG.PILLAR_TOP) {
      hero.y = CFG.PILLAR_TOP - R; hero.vx = 0; hero.vy = 0; hero.onPillar = true;

    }

}

function crumbleAt(ci) {
  for (let k = -3; k <= 3; k++) { const i = ci + k; if (colType(i) === 2) cType[ri(i)] = 3; }
  const x = rope.ax, y = rope.ay;
  burst(2, x, y, 18, 260, 1.4, 7, 1400, 0, 1, 2.2);
  burst(0, x, y, 14, 200, 0.7, 6, 200, 0, 1, 3);
  popup('와르르!', x, y + 60, C.crackLine, 26); S.stats.crumbles++;
  sfx.crumble();
  if (!reduceMotion) cam.shake = Math.max(cam.shake, 7);

  rope.state = 'retract'; rope.tipX = rope.ax; rope.tipY = rope.ay;
  S.combo = 0;
}
let lastBump = 0;
function bumpFx(x, y) {
  if (S.t - lastBump < 0.2) return; lastBump = S.t; S.stats.bumps++;
  burst(0, x, y, 8, 160, 0.4, 4, 400, 0, 1, 2.5); sfx.bump();
}

function update(dt) {
  S.t += dt;
  if (S.mode === 'title') {
    // gentle analytic swing for the attract scene
    const L = rope.len, w = Math.sqrt(CFG.G / L) * 0.85;
    rope.phi = 0.75 * Math.sin(S.t * w); rope.omega = 0.75 * w * Math.cos(S.t * w);
    hero.x = rope.ax + L * Math.sin(rope.phi); hero.y = rope.ay + L * Math.cos(rope.phi);
    hero.vx = rope.omega * L * Math.cos(rope.phi); hero.vy = -rope.omega * L * Math.sin(rope.phi);
    hero.rot = -rope.phi;
    titleCam();
    updateWater(dt); updateParts(dt);
    return;
  }
  if (S.mode === 'paused' || S.mode === 'over') { if (S.mode === 'over') { updateParts(dt); updateWater(dt); } return; }

  if (S.mode === 'play') {
    S.playT += dt;
    S.acc += dt;
    let n = 0;
    while (S.acc >= CFG.STEP && n < 12) { step(CFG.STEP); S.acc -= CFG.STEP; n++; }
    if (n >= 12) S.acc = 0;

    // progress

    const dist = Math.max(0, Math.floor((S.maxX - CFG.PILLAR_X) / CFG.UNIT));
    if (dist !== S.dist) {
      S.dist = dist;

let rockPattern = null, crackPattern = null, waterGrad = null, shaftGrad = null;

  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  for (let i = 0; i < 26; i++) {
    const x = rnd() * s, y = rnd() * s, r = 8 + rnd() * 26;
    g.fillStyle = rnd() < 0.5 ? dark : light; g.globalAlpha = 0.18 + rnd() * 0.2;
    for (let ox = -s; ox <= s; ox += s) for (let oy = -s; oy <= s; oy += s) {
      g.beginPath(); g.ellipse(x + ox, y + oy, r, r * 0.7, rnd() * 3, 0, TAU); g.fill();
    }
  }
  g.globalAlpha = 0.5; g.fillStyle = light;
  for (let i = 0; i < 70; i++) g.fillRect(rnd() * s, rnd() * s, 2, 2);
  if (cracks) {
    g.globalAlpha = 0.45; g.strokeStyle = C.crackLine; g.lineWidth = 2; g.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      let x = rnd() * s, y = rnd() * s; g.beginPath(); g.moveTo(x, y);

}
function buildGradients() {

function drawStacks(par, baseY, maxH, color, alpha, seedOff) {

function drawCeiling() {
  const COL = CFG.COL;

  const top = cam.y - 40;
  // light shafts through holes
  ctx.fillStyle = shaftGrad;
  let i = i0;
  while (i <= i1) {
    if (!isSolid(colType(i))) {
      const s0 = i; while (i <= i1 + 40 && !isSolid(colType(i))) i++;

      ctx.beginPath(); ctx.moveTo(xa, top); ctx.lineTo(xb, top); ctx.lineTo(xb + 90, 700); ctx.lineTo(xa + 50, 700); ctx.closePath(); ctx.fill();

  ctx.strokeStyle = C.hero; ctx.lineWidth = R * 0.62;
  ctx.stroke();
  ctx.strokeStyle = '#8f3a1c'; ctx.setLineDash(TAIL_DASH); ctx.lineDashOffset = 0; ctx.stroke(); ctx.setLineDash(NO_DASH);

  // legs
  const legSw = hanging ? Math.sin(S.t * 8) * R * 0.12 : 0;
  ctx.strokeStyle = C.heroDark; ctx.lineWidth = R * 0.34;
  ctx.beginPath();
  if (sitting) { ctx.moveTo(-R * 0.25, R * 0.75); ctx.lineTo(-R * 0.35, R * 0.95); ctx.moveTo(R * 0.25, R * 0.75); ctx.lineTo(R * 0.45, R * 0.95); }
  else if (hanging) { ctx.moveTo(-R * 0.22, R * 0.75); ctx.lineTo(-R * 0.25 + legSw, R * 1.15); ctx.moveTo(R * 0.22, R * 0.75); ctx.lineTo(R * 0.3 - legSw, R * 1.12); }
  else { ctx.moveTo(-R * 0.22, R * 0.75); ctx.lineTo(-R * 0.55, R * 1.05); ctx.moveTo(R * 0.22, R * 0.75); ctx.lineTo(R * 0.5, R * 1.1); }
  ctx.stroke();

  // body
  ctx.fillStyle = C.ink;
  ctx.beginPath(); ctx.ellipse(0, R * 0.38, R * 0.66, R * 0.62, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = C.hero;
  ctx.beginPath(); ctx.ellipse(0, R * 0.38, R * 0.58, R * 0.55, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = C.heroDark;
  ctx.beginPath(); ctx.ellipse(0, R * 0.55, R * 0.34, R * 0.34, 0, 0, TAU); ctx.fill();

  // arms
  ctx.strokeStyle = C.ink; ctx.lineWidth = R * 0.36 + 3;
  const armPath = () => {
    ctx.beginPath();
    if (hanging) { ctx.moveTo(-R * 0.42, R * 0.15); ctx.lineTo(-R * 0.1, -R * 1.25); ctx.moveTo(R * 0.42, R * 0.15); ctx.lineTo(R * 0.1, -R * 1.32); }
    else if (sitting) { ctx.moveTo(-R * 0.45, R * 0.2); ctx.lineTo(-R * 0.6, R * 0.6); ctx.moveTo(R * 0.45, R * 0.2); ctx.lineTo(R * 0.62, R * 0.55); }
    else if (hero.dead) { ctx.moveTo(-R * 0.45, R * 0.1); ctx.lineTo(-R * 0.9, -R * 1.0); ctx.moveTo(R * 0.45, R * 0.1); ctx.lineTo(R * 0.9, -R * 1.0); }
    else { const f = Math.sin(S.t * 14) * R * 0.12; ctx.moveTo(-R * 0.45, R * 0.15); ctx.lineTo(-R * 1.05, -R * 0.45 + f); ctx.moveTo(R * 0.45, R * 0.15); ctx.lineTo(R * 1.05, -R * 0.5 - f); }
  };
  armPath(); ctx.stroke();
  ctx.strokeStyle = C.heroDark; ctx.lineWidth = R * 0.36; armPath(); ctx.stroke();

  // scarf (trailing ribbon)
  const sx0 = -R * 0.2, sy0 = R * 0.0;
  const fl = Math.sin(S.t * 18) * R * 0.18;
  const sex = sx0 - (sitting ? R * 0.9 : (lvx * 1.6 * trail + 0.4) * R), sey = sy0 + (sitting ? R * 0.5 : (-lvy * 1.6 * trail) * R) + fl;
  ctx.strokeStyle = C.ink; ctx.lineWidth = R * 0.3 + 3;
  ctx.beginPath(); ctx.moveTo(sx0, sy0); ctx.quadraticCurveTo((sx0 + sex) / 2 - fl, (sy0 + sey) / 2 + fl, sex, sey); ctx.stroke();
  ctx.strokeStyle = C.scarf; ctx.lineWidth = R * 0.3; ctx.stroke();
  ctx.fillStyle = C.scarf; ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, -R * 0.02, R * 0.56, R * 0.17, 0, 0, TAU); ctx.fill(); ctx.stroke();

  // head
  const hy = -R * 0.5;
  // ears
  ctx.fillStyle = C.hero; ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5;
  for (let e = -1; e <= 1; e += 2) {
    ctx.beginPath(); ctx.moveTo(e * R * 0.28, hy - R * 0.55); ctx.quadraticCurveTo(e * R * 0.62, hy - R * 1.1, e * R * 0.72, hy - R * 0.32); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.heroLight; ctx.beginPath(); ctx.moveTo(e * R * 0.38, hy - R * 0.55); ctx.quadraticCurveTo(e * R * 0.6, hy - R * 0.9, e * R * 0.64, hy - R * 0.45); ctx.closePath(); ctx.fill();
    ctx.fillStyle = C.hero;
  }
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(0, hy, R * 0.74 + 2.5, 0, TAU); ctx.fill();
  ctx.fillStyle = C.hero; ctx.beginPath(); ctx.arc(0, hy, R * 0.74, 0, TAU); ctx.fill();
  // face patches
  ctx.fillStyle = C.heroLight;
  ctx.beginPath(); ctx.ellipse(0, hy + R * 0.26, R * 0.42, R * 0.3, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-R * 0.3, hy - R * 0.32, R * 0.12, R * 0.08, -0.3, 0, TAU); ctx.ellipse(R * 0.36, hy - R * 0.32, R * 0.12, R * 0.08, 0.3, 0, TAU); ctx.fill();
  // tear stripes
  ctx.strokeStyle = '#a8401f'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-R * 0.3, hy - R * 0.02); ctx.lineTo(-R * 0.38, hy + R * 0.3); ctx.moveTo(R * 0.36, hy - R * 0.02); ctx.lineTo(R * 0.44, hy + R * 0.3); ctx.stroke();
  // eyes
  ctx.fillStyle = C.ink;
  if (hero.dead) {
    ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-R * 0.36, hy - R * 0.2); ctx.lineTo(-R * 0.18, hy - R * 0.04); ctx.moveTo(-R * 0.18, hy - R * 0.2); ctx.lineTo(-R * 0.36, hy - R * 0.04);
    ctx.moveTo(R * 0.24, hy - R * 0.2); ctx.lineTo(R * 0.42, hy - R * 0.04); ctx.moveTo(R * 0.42, hy - R * 0.2); ctx.lineTo(R * 0.24, hy - R * 0.04);
    ctx.stroke();
  } else {
    const big = !hero.onPillar && hero.vy > 500 ? 1.25 : 1;
    ctx.beginPath(); ctx.arc(-R * 0.27, hy - R * 0.12, R * 0.11 * big, 0, TAU); ctx.arc(R * 0.33, hy - R * 0.12, R * 0.11 * big, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(-R * 0.24, hy - R * 0.16, R * 0.04, 0, TAU); ctx.arc(R * 0.36, hy - R * 0.16, R * 0.04, 0, TAU); ctx.fill();
  }
  // nose + mouth
  ctx.fillStyle = C.ink;
  ctx.beginPath(); ctx.ellipse(R * 0.04, hy + R * 0.13, R * 0.09, R * 0.06, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
  ctx.beginPath();
  if (hanging || sitting || S.mode === 'title') { ctx.moveTo(-R * 0.06, hy + R * 0.25); ctx.quadraticCurveTo(R * 0.04, hy + R * 0.34, R * 0.14, hy + R * 0.25); }
  else { ctx.ellipse(R * 0.04, hy + R * 0.3, R * 0.07, R * 0.08, 0, 0, TAU); }
  ctx.stroke();
  ctx.restore();
}
const TAIL_DASH = [5, 7];

function drawWater() {
  const x0 = cam.x - 30, x1 = cam.x + VW + 30, bottom = cam.y + VH + 40;
  const stepX = 18;
  // back layer
  ctx.fillStyle = 'rgba(31, 128, 140, 0.55)';
  ctx.beginPath(); ctx.moveTo(x0, bottom);
  for (let x = x0; x <= x1 + stepX; x += stepX) ctx.lineTo(x, waterAt(x + 60) - 12 + Math.sin(x * 0.02 + S.t * 2.1) * 4);
  ctx.lineTo(x1 + stepX, bottom); ctx.closePath(); ctx.fill();
  // front
  ctx.save(); ctx.translate(0, water.y - 20);
  ctx.fillStyle = waterGrad;
  ctx.beginPath(); ctx.moveTo(x0, bottom - water.y + 20);
  for (let x = x0; x <= x1 + stepX; x += stepX) ctx.lineTo(x, waterAt(x) - water.y + 20);
  ctx.lineTo(x1 + stepX, bottom - water.y + 20); ctx.closePath(); ctx.fill();
  ctx.restore();
  // foam crest
  ctx.strokeStyle = C.foam; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let x = x0; x <= x1 + stepX; x += stepX) { const yy = waterAt(x); if (x === x0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy); }
  ctx.stroke();
  // foam bubbles along crest
  ctx.fillStyle = 'rgba(234, 255, 248, 0.75)';
  ctx.beginPath();
  const b0 = Math.floor(x0 / 46);
  for (let k = b0; k * 46 < x1; k++) {
    const hv = hash(k * 11);
    if (hv < 0.45) continue;
    const bx = k * 46 + Math.sin(S.t * 1.5 + k) * 8, by = waterAt(bx) + 6 + hv * 10;
    const r = 2 + hv * 4;
    ctx.moveTo(bx + r, by); ctx.arc(bx, by, r, 0, TAU);
  }
  ctx.fill();
  // light streaks under surface
  ctx.strokeStyle = 'rgba(234, 255, 248, 0.12)'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let k = b0; k * 46 < x1; k++) {
    const hv = hash(k * 17 + 3); if (hv < 0.6) continue;
    const bx = k * 46, by = water.y + 40 + hv * 120 + Math.sin(S.t + k) * 6;
    ctx.moveTo(bx, by); ctx.lineTo(bx + 30 + hv * 40, by);
  }
  ctx.stroke();
}

function drawParticles() {
  for (let kind = 0; kind < 5; kind++) {
    ctx.fillStyle = kind === 0 ? '#c9b3a8' : kind === 1 ? C.foam : kind === 2 ? C.crack : kind === 3 ? C.accent2 : C.moss;
    for (let i = 0; i < PMAX; i++) {
      const p = parts[i]; if (!p.on || p.kind !== kind) continue;
      const a = p.life / p.max;
      ctx.globalAlpha = kind === 2 ? 1 : a;
      const sz = kind === 0 ? p.size * (1.6 - a * 0.6) : p.size;
      if (kind === 2) ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
      else { ctx.beginPath(); ctx.arc(p.x, p.y, sz, 0, TAU); ctx.fill(); }
    }
  }
  ctx.globalAlpha = 1;
}
function drawPopups() {
  const minY = cam.y + 110 / SCALE;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (let i = 0; i < POPMAX; i++) {
    const p = pops[i]; if (!p.on) continue;
    const a = clamp(p.life / p.max * 1.6, 0, 1);
    const sc = 1 + Math.max(0, p.life - p.max + 0.15) * 3;
    ctx.globalAlpha = a;
    const py = Math.max(p.y, minY);
    ctx.font = (p.size * sc).toFixed(1) + 'px ' + FONT;
    ctx.strokeStyle = C.ink; ctx.lineWidth = 6; ctx.strokeText(p.text, p.x, py);
    ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, py);
  }
  ctx.globalAlpha = 1;
}
function drawAimGuide() {
  // faint dotted guide of where the rope would go (only when ready and airborne)
  if (S.mode !== 'play' || rope.state !== 'ready' || hero.onPillar) return;
  const dx = Math.cos(CFG.ROPE_ANGLE), dy = -Math.sin(CFG.ROPE_ANGLE);
  ctx.fillStyle = 'rgba(255, 245, 230, 0.32)';
  ctx.beginPath();
  for (let s = 40; s < CFG.ROPE_MAX; s += 26) {
    const x = hero.x + dx * s, y = hero.y - CFG.R * 0.6 + dy * s;
    const ci = Math.floor(x / CFG.COL);
    if (y < -80) break;
    if (isSolid(colType(ci)) && y <= colSurf(ci)) break;
    ctx.moveTo(x + 2.2, y); ctx.arc(x, y, 2.2, 0, TAU);
  }
  ctx.fill();
}

function render() {
  drawBackground();
  worldTransform();
  drawCeiling();
  drawPillar();
  drawGhost();
  drawAimGuide();
  drawRope();
  drawHero();
  drawParticles();
  drawWater();
  drawPopups();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // danger tint when water is close
  if (S.mode === 'play' && !hero.onPillar) {
    const gap = waterAt(hero.x) - hero.y;
    if (gap < 140) {
      ctx.globalAlpha = clamp((140 - gap) / 140, 0, 1) * (reduceMotion ? 0.12 : 0.22);
      ctx.fillStyle = C.waterDeep; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    }
  }
}

// ================= LOOP =================
let lastTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000; lastTs = ts;
  dt = Math.min(dt, 0.05) * S.timeScale;
  update(dt);
  render();
}

// ================= INPUT =================
function isUiTarget(t) { return t && t.closest && t.closest('button, a, .overlay'); }
app.addEventListener('pointerdown', (e) => {
  if (isUiTarget(e.target)) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  if (S.mode === 'play') { ensureAudio(); action(); }
});
window.addEventListener('keydown', (e) => {
  const k = e.code || e.key;
  if (k === 'Space' || k === ' ' || k === 'Enter' || k === 'ArrowUp' || k === 'KeyW') {
    e.preventDefault();
    if (e.repeat) return;
    if (S.mode === 'play') { ensureAudio(); action(); }
    else if (S.mode === 'title') startGame();
    else if (S.mode === 'paused') resumeGame();
    else if (S.mode === 'over' && performance.now() - S.resultAt > 700) startGame();
  } else if (k === 'Escape' || k === 'KeyP') {
    if (S.mode === 'play') pauseGame(); else if (S.mode === 'paused') resumeGame();
  } else if (k === 'KeyM') {
    setMuted(!AU.muted);
  }
});
window.addEventListener('keyup', (e) => { if (e.code === 'Space' || e.key === ' ') e.preventDefault(); });
// buttons must not keep focus, or Space would "click" them again during play
document.addEventListener('click', (e) => { const b = e.target.closest && e.target.closest('button'); if (b) b.blur(); });
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());
document.addEventListener('touchmove', (e) => { if (!e.target.closest || !e.target.closest('.overlay')) e.preventDefault(); }, { passive: false });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
window.addEventListener('blur', () => pauseGame());
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

$('btnStart').addEventListener('click', startGame);
$('btnRetry').addEventListener('click', startGame);
$('btnResume').addEventListener('click', resumeGame);
$('btnPause').addEventListener('click', () => { ensureAudio(); pauseGame(); });
$('btnHome').addEventListener('click', () => { sfx.click(); goTitle(); });
ui.btnMute.addEventListener('click', () => { ensureAudio(); setMuted(!AU.muted); });
document.querySelectorAll('a.back').forEach((a) => a.addEventListener('click', (e) => {
  try {
    if (document.referrer && new URL(document.referrer).origin === location.origin) { e.preventDefault(); history.back(); }
  } catch (err) { /* follow link */ }
}));

// ================= DEBUG HOOK =================
window.__game = {
  get state() {
    return {
      mode: S.mode, x: hero.x, y: hero.y, vx: hero.vx, vy: hero.vy, onPillar: hero.onPillar,
      rope: rope.state, phi: rope.phi, omega: rope.omega, len: rope.len, ax: rope.ax, ay: rope.ay, crumble: rope.crumble,
      dist: S.dist, best: S.best, waterY: water.y, waterAtHero: waterAt(hero.x), t: S.t, playT: S.playT,
      newRecord: S.newRecord, stats: Object.assign({}, S.stats), particles: parts.reduce((n, p) => n + (p.on ? 1 : 0), 0), camX: cam.x, viewW: VW, viewH: VH,
    };
  },
  shoot: () => shootRope(),
  release: () => releaseRope(),
  action: () => action(),
  start: () => startGame(),
  forceGameOver: () => gameOver('forced'),
  place(x, y, vx, vy) { // test helper: put the hero in free flight
    if (S.mode !== 'play') return;
    hero.onPillar = false; hero.x = x; hero.y = y; hero.vx = vx || 0; hero.vy = vy || 0;
    rope.state = 'ready'; S.maxX = Math.max(S.maxX, x); S.lastProgT = S.playT;
    cam.x = x - VW * 0.3;
  },
  findHole(fromX) { // test helper: [start, end) x of the next hole
    let i = Math.floor(fromX / CFG.COL); while (isSolid(colType(i))) i++;
    const s0 = i; while (!isSolid(colType(i))) i++;
    return { x0: s0 * CFG.COL, x1: i * CFG.COL };
  },
  col(x) { const i = Math.floor(x / CFG.COL); return { type: colType(i), surf: colSurf(i), solid: isSolid(colType(i)) }; },
  waterAt: (x) => waterAt(x),
  cfg: CFG,
  get timeScale() { return S.timeScale; },
  set timeScale(v) { S.timeScale = clamp(+v || 1, 0.05, 8); },
};

// ================= BOOT =================
setMuted(AU.muted);
resize();
goTitle();
requestAnimationFrame(frame);
try { if (document.fonts && document.fonts.load) Promise.race([document.fonts.load('20px "Jua"'), new Promise((r) => setTimeout(r, 1500))]).catch(() => {}); } catch (e) { /* ignore */ }
})();
</script>
</body>
</html>
